function mkChart(host,o){
 const hidden=new Set(),NAR=(host.clientWidth||640)<520,W=NAR?400:640,H=o.h||230,m={l:NAR?36:42,r:10,t:12,b:26};let first=true,iw=W-m.l-m.r,ih=H-m.t-m.b,n=o.x.length,bw=iw/n;
 host.classList.add('chart');host.innerHTML='<div class="svgbox"></div><div class="leg"></div><div class="tip"></div>';
 const box=host.querySelector('.svgbox'),leg=host.querySelector('.leg'),tip=host.querySelector('.tip');
 const series=[...(o.bars||[]).map(s=>({...s,t:'b'})),...(o.lines||[]).map(s=>({...s,t:'l'}))];
 function draw(){
  const vis=series.filter(s=>!hidden.has(s.n));
  let mx=Math.max(...vis.flatMap(s=>s.v).filter(v=>v!=null),...(o.hlines||[]).map(h=>h.v),1)*1.07;
  const raw=mx/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(k=>k*pw).find(k=>k>=raw);mx=st*4;
  const X=i=>m.l+(i+.5)*bw,Y=v=>m.t+ih-v/mx*ih;let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<=4;k++){const y=Y(st*k);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-6}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--mut)">${lk(st*k)}</text>`}
  (o.shade||[]).forEach(i=>s+=`<rect x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${ih}" fill="var(--shade)"/>`);
  o.x.forEach((t,i)=>{if(i%Math.max(1,Math.ceil(n*(NAR?30:22)/iw))==0)s+=`<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mut)">${t}</text>`});
  vis.filter(q=>q.t=='b').forEach(q=>q.v.forEach((v,i)=>{if(v==null)return;const h=v/mx*ih;s+=`<rect ${first?`class="gb" style="animation-delay:${Math.min(i*16,460)}ms" `:''}x="${m.l+i*bw+1.5}" y="${m.t+ih-h}" width="${Math.max(bw-3,1)}" height="${h}" rx="3" fill="${q.c}" opacity="${q.o||1}"/>`}));
  vis.filter(q=>q.t=='l').forEach(q=>{let d='',pen=false;q.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});

   if(q.dots)q.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${q.c}"/>`})});
  (o.hlines||[]).forEach(h=>{const y=Y(h.v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="${h.c||'var(--org)'}" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-m.r-2}" y="${y-4}" font-size="11" text-anchor="end" fill="${h.c||'var(--org)'}" font-weight="600">${h.label}</text>`});
  (o.vlines||[]).forEach(v=>{const x=X(v.i);s+=`<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ih}" stroke="${v.c||'var(--mut)'}" stroke-dasharray="3 4"/><text x="${x+3}" y="${m.t+11}" font-size="10.5" fill="${v.c||'var(--mut)'}">${v.label}</text>`});
  s+=`<rect class="hv" x="0" y="${m.t}" width="${bw}" height="${ih}" fill="var(--blue)" opacity="0"/></svg>`;box.innerHTML=s;first=false;
  const svg=box.querySelector('svg'),hv=svg.querySelector('.hv');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;let i=Math.floor((px-m.l)/bw);if(i<0||i>=n){tip.style.display='none';hv.setAttribute('opacity',0);return}
   hv.setAttribute('x',m.l+i*bw);hv.setAttribute('opacity',.08);
   const rows=vis.filter(q=>q.v[i]!=null).map(q=>`<div><span style="color:${q.c}">●</span> ${q.n}: <b>${(o.fmt||f)(q.v[i])}</b></div>`).join('');
   tip.innerHTML=`<b>${o.tl?o.tl(i):o.x[i]}</b>${rows}${o.extra?o.extra(i):''}`;tip.style.display='block';

  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',()=>{tip.style.display='none';hv.setAttribute('opacity',0)});

const LC={Hindi:'#3b82f6',Telugu:'#ff7a45',Bangla:'#ef4565',Kannada:'#f59e0b',Marathi:'#a855f7',Tamil:'#0fb5a6',Punjabi:'#84cc16',Gujarati:'#ec4899',Malayalam:'#12a36b',Odia:'#0ea5e9',English:'#64748b',Bhojpuri:'#b45309',Haryanvi:'#78716c',Maithili:'#c026d3'},lc=l=>LC[l]||'#6d4aff';
const left=(v,t)=>Math.max(t-v,0);
const pctLeft=(v,t)=>left(v,t)/t;
function langTile(l,v,t,attr){const c=lc(l);return `<details class="tile lang" ${attr||''} data-l="${l}" style="--lc:${c}"><summary><b>${l}</b><div class="lbig" style="color:${c}">${f(v)}</div><span>calls done</span><em class="hint">Tap for daily counts ▾</em></summary><div class="ld"></div></details>`}
function bindLangs(root,getDaily,extra){root.querySelectorAll('details.lang').forEach(el=>el.addEventListener('toggle',()=>{if(!el.open||el.dataset.done)return;el.dataset.done=1;const l=el.dataset.l,dl=getDaily(el),box=el.querySelector('.ld'),tot=dl.reduce((p,c)=>p+c,0);
  const days=dl.map((v,i)=>[i,v]).reverse();
  box.innerHTML=`<div class="lchart"></div><div class="lsum"><div><b>${f(tot)}</b><span>total</span></div><div><b>${f(dl[dl.length-1])}</b><span>yesterday</span></div><div><b>${f(Math.max(...dl))}</b><span>best day</span></div><div><b>${f(avg(dl.slice(-7)))}</b><span>7-day avg</span></div></div>${extra?extra(l):''}<div class="tw"><table><tr><th>Day</th><th>Calls</th><th>Total so far</th></tr>${days.map(([i,v])=>`<tr class="${isSun(D.dnum[i])?'sun':''}"><td>${D.days[i]}</td><td><b>${f(v)}</b></td><td>${f(dl.slice(0,i+1).reduce((p,c)=>p+c,0))}</td></tr>`).join('')}</table></div>`;
  mkChart(box.querySelector('.lchart'),{x:D.dnum,tl:i=>D.days[i],h:170,shade:D.dnum.map((n,i)=>isSun(n)?i:-1).filter(i=>i>=0),bars:[{n:l+' calls',c:lc(l),v:dl}]})}))}
const teamSplit=l=>{const o=D.regTeam[l]||{};return `<div class="split">${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span class="chip info">${t=='UN'?'Unassigned':D.teams[t].name}: <b>${f(n)}</b></span>`).join('')}</div>`};
function spark(a,col){const W=120,H=34,mx=Math.max(...a,1),p=a.map((v,i)=>[i*(W/Math.max(a.length-1,1)),H-3-v/mx*(H-8)]);return `<svg viewBox="0 0 ${W} ${H}" class="spark"><path d="M${p.map(x=>x[0].toFixed(1)+' '+x[1].toFixed(1)).join('L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="3" fill="${col}"/></svg>`}
let OVS='far';
function rgSorted(){const c=D.co,k=REGL.slice();k.sort((a,b)=>c.reg[b]-c.reg[a]);return k}
function renderRg(){const c=D.co,box=document.getElementById('rg');if(!box)return;box.innerHTML=rgSorted().map(l=>langTile(l,c.reg[l])).join('');bindLangs(box,el=>c.regl[el.dataset.l],teamSplit)}
function othCard(o,note){const ks=Object.keys(o).sort((a,b)=>o[b]-o[a]);
 return `<div class="card" style="margin-top:12px"><h2>Other languages · done till date</h2><p class="sub">${note||''}</p><div class="grid g4">${ks.map(l=>`<div class="tile"><b>${f(o[l])}</b><span>${l}</span></div>`).join('')}</div></div>`}
function hindiCard(r,who){return `<div class="card" style="margin-top:12px"><h2>Hindi calls · ${who}</h2><p class="sub">Hindi language calls only.</p><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="tile acc"><b>${f(r.hindi)}</b><span>Hindi calls done</span></div><div class="tile"><b>${hrs(r.hindi)}</b><span>hours (12 calls = 1 hr)</span></div></div></div>`}
function codeRows(T){return D.codes.filter(c=>!T||c[1]==T).map(c=>({code:c[0],team:c[1],hindi:c[2],all:c[3],yall:c[5],reg:c[6],l:c[7],rd:c[8],yreg:c[8][c[8].length-1],last3:c[8].slice(-3).reduce((p,x)=>p+x,0),langs:Object.entries(c[7]).sort((a,b)=>b[1]-a[1])}))}
function codeTip(r){const tl=D.teams[r.team].langs.map(x=>x.lang);
 if(r.reg==0)return r.hindi>=30?`Strong on Hindi (${f(r.hindi)}) but no regional calls yet. Ask this referrer to also bring ${tl.slice(0,3).join(' / ')} speaking contacts.`:'No regional calls yet. Ask this referrer to bring regional-language contacts.';
 if(r.last3==0)return `Made ${f(r.reg)} regional calls earlier but none in the last 3 days. Remind this referrer.`;
 const miss=tl.find(l=>!(l in r.l));
 return `Best regional language: ${r.langs[0][0]} (${f(r.langs[0][1])} calls).`+(miss?` Ask for ${miss} contacts too.`:'')}
function teamTips(T){const r=D.teams[T],rows=codeRows(T),t=[],tr=rows.reduce((p,x)=>p+x.reg,0);
 const lg=r.langs.slice().sort((a,b)=>a.done-b.done);
 t.push(['🎯','Focus languages',`${lg.slice(0,3).map(x=>x.lang+' ('+f(x.done)+' so far)').join(', ')} have the fewest calls. Ask every caller to take these contacts first.`]);
 const top=rows.filter(x=>x.reg>0).sort((a,b)=>b.reg-a.reg);
 if(top.length)t.push(['⭐','Learn from the top regional codes',`${top.slice(0,3).map(x=>x.code+' ('+f(x.reg)+')').join(', ')} give ${pc(top.slice(0,3).reduce((p,x)=>p+x.reg,0)/Math.max(tr,1))} of this team's regional calls. Ask what they do differently and share it with the others.`]);
 lg.slice(0,2).forEach(x=>{const b=rows.filter(c=>c.l[x.lang]).sort((p,q)=>q.l[x.lang]-p.l[x.lang]);if(b.length)t.push(['🗣️',x.lang+' calls',`${b.length} code${b.length>1?'s have':' has'} made ${x.lang} calls so far. ${b[0].code} leads with ${f(b[0].l[x.lang])}. Ask more codes to reach ${x.lang}-speaking contacts.`])});
 const hs=rows.filter(x=>x.reg==0&&x.hindi>=100).sort((a,b)=>b.hindi-a.hindi);
 if(hs.length)t.push(['🔁','Hindi-strong codes with no regional calls',`${hs.length} code${hs.length>1?'s have':' has'} 100+ Hindi calls but no regional calls yet: ${hs.slice(0,5).map(x=>x.code).join(', ')}. Ask them to bring regional-language contacts too.`]);
 const qu=rows.filter(x=>x.reg>=5&&x.last3==0).sort((a,b)=>b.reg-a.reg);
 if(qu.length)t.push(['😴','Regional codes gone quiet',`${qu.slice(0,5).map(x=>x.code+' ('+f(x.reg)+')').join(', ')} made no regional calls in the last 3 days. Call their referrers today.`]);
 const cs=Object.values(D.co.reg).reduce((p,x)=>p+x,0)/D.co.calls,ts=tr/r.calls;
 t.push(['📊','Regional share of calls',`${pc(ts)} of ${r.name}'s calls are regional, against ${pc(cs)} company-wide.`+(ts<cs?' Try to lift it above the company level.':' Above the company level, keep it up.')]);
 const rd=r.regd,y=rd[rd.length-1],b7=avg(rd.slice(-8,-1));
 if(b7>0)t.push([y<b7*.8?'📉':'📈',y<b7*.8?'Regional calls dipped yesterday':'Regional calls held up yesterday',`${f(y)} regional calls yesterday against a usual ${f(b7)} a day over the week before.`]);
 return t}
/* ---------- code table (cards on phones, table on desktop) ---------- */
function codeTable(host,rows,o){
 const mq=matchMedia('(max-width:700px)');
 const st={q:'',tf:'ALL',sf:'ALL',k:'reg',d:-1,open:null,lim:30};
 const SORTS=[['reg','Most regional calls'],['yreg','Regional yesterday'],['last3','Regional last 3 days'],['hindi','Most Hindi calls'],['all','Total calls'],['code','Code A–Z']];
 const SEG=[['ALL','All'],['Y','With regional'],['N','No regional yet'],['Q','Quiet 3 days']];
 host.innerHTML=`<div class="flt${o.search?' stk':''}">${o.search?'<input class="q" type="search" placeholder="🔍 Search a code, e.g. CRNI" autocomplete="off">':''}<div class="row2">${o.teams?'<select class="tf"><option value="ALL">All teams</option>'+TK.map(t=>`<option value="${t}">${D.teams[t].name}</option>`).join('')+'</select>':''}<select class="so">${SORTS.map(s=>`<option value="${s[0]}">Sort: ${s[1]}</option>`).join('')}</select></div><div class="seg"></div></div><div class="meta"></div><div class="tw tbl"><table></table></div><div class="cl"></div><div class="mre"></div>`;
 const $=s=>host.querySelector(s),tb=$('table'),cl=$('.cl'),seg=$('.seg'),meta=$('.meta'),mre=$('.mre'),so=$('.so');
 const sf=r=>st.sf=='ALL'||(st.sf=='Y'&&r.reg>0)||(st.sf=='N'&&r.reg==0)||(st.sf=='Q'&&r.reg>=5&&r.last3==0);
 const lt=r=>r.langs.length?r.langs.slice(0,3).map(([l,v])=>l+' '+f(v)).join(' · '):'No regional calls yet';
 const card=r=>{const op=st.open==r.code;
  return `<div class="cc${op?' open':''}" data-c="${r.code}" style="--c:${COL[r.team]}"><div class="ct"><b class="code">${r.code}</b><span class="tm">${o.teams?D.teams[r.team].name.replace('mDigital-',''):''}</span></div>
  <div class="pg"><small>${lt(r)}</small></div>
  <div class="st4"><div class="g"><b>${f(r.reg)}</b><span>Regional</span></div><div><b>${r.yreg}</b><span>Yest. regional</span></div><div><b>${f(r.hindi)}</b><span>Hindi</span></div><div><b>${f(r.all)}</b><span>Total</span></div></div>
  ${op?`<div class="cd"></div><div class="more2">${codeTip(r)}</div>`:''}</div>`};
 const draw=()=>{if(!host.isConnected)return;const M=mq.matches;
  const base=rows.filter(r=>(!st.q||r.code.includes(st.q))&&(st.tf=='ALL'||r.team==st.tf));
  const rs=base.filter(sf);
  rs.sort((a,b)=>(a[st.k]>b[st.k]?1:a[st.k]<b[st.k]?-1:0)*st.d);
  const cnt=k=>{const s0=st.sf;st.sf=k;const n=base.filter(sf).length;st.sf=s0;return n};
  seg.innerHTML=SEG.map(s=>`<button data-s="${s[0]}" class="${st.sf==s[0]?'on':''}">${s[1]}<em>${cnt(s[0])}</em></button>`).join('');
  meta.textContent=`${rs.length} code${rs.length==1?'':'s'}`+(st.q?` matching "${st.q}"`:'');so.value=SORTS.some(s=>s[0]==st.k)?st.k:'reg';
  const chart=(el,r,h)=>mkChart(el,{x:D.dnum,tl:i=>D.days[i],h,bars:[{n:r.code+' regional calls',c:COL[r.team],v:r.rd}]});
  if(M){tb.innerHTML='';cl.innerHTML=rs.length?rs.slice(0,st.lim).map(card).join(''):'<div class="help">No codes match. Try another filter.</div>';
   mre.innerHTML=rs.length>st.lim?`<button>Show ${Math.min(30,rs.length-st.lim)} more · ${rs.length-st.lim} left</button>`:'';
   if(st.open){const r=rows.find(x=>x.code==st.open),el=cl.querySelector('.cc.open .cd');if(r&&el)chart(el,r,160)}}
  else{cl.innerHTML='';mre.innerHTML='';const cols=[['code','Code'],['team','Team'],['reg','Regional calls'],['yreg','Regional yesterday'],['last3','Regional last 3 days'],['hindi','Hindi calls'],['all','Total calls']].filter(c=>o.teams||c[0]!='team');
   tb.innerHTML=`<tr>${cols.map(c=>`<th class="s" data-k="${c[0]}">${c[1]}${st.k==c[0]?(st.d<0?' ▼':' ▲'):''}</th>`).join('')}<th>Regional languages</th></tr>`+rs.slice(0,300).map(r=>{
    const row=`<tr class="row" data-c="${r.code}"><td><b>${r.code}</b></td>${o.teams?`<td class="l">${D.teams[r.team].name.replace('mDigital-','')}</td>`:''}<td><b>${f(r.reg)}</b></td><td>${r.yreg}</td><td>${r.last3}</td><td>${f(r.hindi)}</td><td>${f(r.all)}</td><td class="l" style="font-size:12.5px">${lt(r)}</td></tr>`;
    return row+(st.open==r.code?`<tr><td colspan="${cols.length+1}"><div id="cd"></div><div class="more2" style="margin-top:6px">${codeTip(r)}</div></td></tr>`:'')}).join('');
   tb.querySelectorAll('th.s').forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.d=st.k==k?-st.d:(k=='code'||k=='team'?1:-1);st.k=k;draw()});
   tb.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{st.open=st.open==tr.dataset.c?null:tr.dataset.c;draw()});
   if(st.open){const r=rows.find(x=>x.code==st.open);if(r&&tb.querySelector('#cd'))chart(tb.querySelector('#cd'),r,150)}}};
 cl.onclick=e=>{const c=e.target.closest('.cc');if(!c||e.target.closest('.cd'))return;st.open=st.open==c.dataset.c?null:c.dataset.c;draw()};
 mre.onclick=e=>{if(e.target.closest('button')){st.lim+=30;draw()}};
 seg.onclick=e=>{const b=e.target.closest('button');if(b){st.sf=b.dataset.s;st.lim=30;draw()}};
 so.onchange=e=>{st.k=e.target.value;st.d=st.k=='code'?1:-1;st.lim=30;draw()};
 const q=$('.q');if(q)q.oninput=e=>{st.q=e.target.value.toUpperCase().trim();st.lim=30;draw()};const tf=$('.tf');if(tf)tf.onchange=e=>{st.tf=e.target.value;st.lim=30;draw()};
 mq.addEventListener('change',draw);draw();fxBars(host);
}
/* ---------- pages ---------- */
let DCSEL=new Set();
function dailyChart(){const c=D.co,x=MONTH.slice(0,N),all=c.alld,AL=c.alll,tot=a=>a.reduce((p,v)=>p+v,0);
 const langs=Object.keys(AL).sort((a,b)=>tot(AL[b])-tot(AL[a]));
 const chips=document.getElementById('dcl');
 const drawC=()=>{const sel=[...DCSEL];
  chips.innerHTML=`<button class="${sel.length?'':'on'}" data-l="" style="--lc:#6d4aff">All languages</button>`+langs.map(l=>`<button class="${DCSEL.has(l)?'on':''}" data-l="${l}" style="--lc:${lc(l)}"><i></i>${l}<em>${f(tot(AL[l]))}</em></button>`).join('');
  const bars=sel.length?[]:[{n:'All languages',c:'#6d4aff',v:all}];
  const lines=sel.map(l=>({n:l,c:lc(l),w:2.8,v:AL[l],dots:1}));
  mkChart(document.getElementById('dcc'),{x,tl:tlab,h:260,shade:D.dnum.map((n,i)=>isSun(n)?i:-1).filter(i=>i>=0),bars,lines});
  const rows=sel.length?sel.map(l=>[l,AL[l],lc(l)]):[['All languages',all,'#6d4aff']];
  document.getElementById('dcs').innerHTML=rows.map(([n,a,col])=>{const t=tot(a),pk=Math.max(...a);return `<div style="--lc:${col}"><b>${n}</b><span>${f(t)} total</span><span>${f(Math.round(t/a.length))}/day avg</span><span>best ${f(pk)} on ${tlab(a.lastIndexOf(pk))}</span><span>last day ${f(a[a.length-1])}</span></div>`}).join('')};
 chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;const l=b.dataset.l;if(!l)DCSEL.clear();else DCSEL.has(l)?DCSEL.delete(l):DCSEL.add(l);drawC()};
 drawC()}
const hrs=n=>(n/12).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
function overview(){const c=D.co,NH=Object.entries(c.alll).filter(e=>e[0]!='Hindi').map(e=>[e[0],e[1].reduce((p,v)=>p+v,0)]).sort((a,b)=>b[1]-a[1]);
 const dn_=NH.reduce((p,e)=>p+e[1],0);
 const AL=c.alll,sm=x=>x.reduce((p,v)=>p+v,0),hin=sm(AL.Hindi||[]),all=sm(c.alld),oth=all-hin;
 let h=`<div class="hgrid"><div class="card hero" style="border-left:5px solid var(--org)"><div class="txt"><small>🎯 Main focus · Regional languages</small><div class="big">${f(dn_)}</div><small>calls in all languages except Hindi, till date</small><div class="hchips">${NH.slice(0,3).map(e=>`<span>${e[0]} ${f(e[1])}</span>`).join('')}<em>top languages</em></div></div></div>
 <div class="card tot"><small>📞 Total calls till date · all languages</small><div class="big">${f(all)}</div><small class="tsub">${D.days[N-1]} · ${f(c.alld[c.alld.length-1])} calls on the last day</small><div class="tsm"><span>Hindi <b>${f(hin)}</b> <em>(${hrs(hin)} Hours)</em></span><span>Other languages <b>${f(oth)}</b> <em>(${hrs(oth)} Hours)</em></span></div></div></div>
<div class="card dcard" style="margin-top:12px"><h2>📈 Daily calls · all languages</h2><p class="sub">Bars show every call per day. Tap a language below to add its own daily line to the same chart.</p><div class="lchips" id="dcl"></div><div id="dcc"></div><div class="dsum" id="dcs"></div></div>
  <div class="card" style="margin-top:12px"><h2>Regional languages</h2><p class="sub">Tap a language for its daily chart and team split.</p><div class="grid g4" id="rg" style="margin-top:10px"></div></div>`;
 h+=othCard(c.oth,'Bhojpuri and Haryanvi are not part of the Hindi count.');

 TK.forEach(t=>{const r=D.teams[t],rg=r.regd.reduce((p,x)=>p+x,0);h+=`<div class="card tcard" style="--c:${COL[t]}" onclick="go('${t}')"><b style="font-size:16px">${r.name}</b><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><div><span class="sub" style="margin:0">Regional calls</span><br><b style="font-size:20px">${f(rg)}</b></div><div><span class="sub" style="margin:0">Yesterday</span><br><b style="font-size:20px">${f(r.regd[r.regd.length-1])}</b></div></div><div class="spk">${spark(r.regd,COL[t])}<small>regional calls per day</small></div><div style="font-size:13.5px;margin-top:10px">Hindi calls: <b>${f(r.hindi)}</b></div></div>`});
 h+=`</div><div class="card" style="margin-top:12px"><h2>Daily regional calls</h2><p class="sub">All regional languages, whole company. Hover or tap a day to see each language's count.</p><div id="o-r"></div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h2>Daily Hindi calls by team</h2><p class="sub">Hover or tap for numbers. Tap a team name to hide it.</p><div id="o-t"></div></div><div class="card"><h2>Hindi running total</h2><p class="sub">Line = Hindi calls so far.</p><div id="o-c"></div></div></div>

 return h}
function mount_team(T){const r=D.teams[T],col=COL[T];
 mount('t-r',{x:MONTH.slice(0,N),tl:tlab,shade:MONTH.slice(0,N).map((n,i)=>isSun(n)?i:-1).filter(i=>i>=0),h:210,bars:[{n:'Regional calls',c:col,v:r.regd}]});
 mount('t-c',{x:MONTH,tl:tlab,h:210,lines:[{n:'Done so far',c:col,w:3,v:pad(r.cumact,0)}]});
 codeTable(document.getElementById('ct'),codeRows(T),{});
 bindLangs(document,el=>r.langs[+el.dataset.i].daily);
 mount('th',{x:Array.from({length:24},(_,i)=>i),tl:i=>i+':00–'+(i+1)+':00',h:200,bars:[{n:'Avg Hindi calls',c:col,v:r.hourAvg}],fmt:v=>f(v)});
 const mx=Math.max(...r.heat.flat(),1);let s='<div></div>'+Array.from({length:24},(_,i)=>`<div class="h">${i%3==0?i:''}</div>`).join('');
 r.heat.forEach((row,d)=>{s+=`<div class="r">${D.days[d].split(' ').slice(0,2).join(' ')}</div>`+row.map((v,h)=>`<div title="${D.days[d]} ${h}:00 → ${v} calls" style="background:${col};opacity:${.07+.93*v/mx}"></div>`).join('')});document.getElementById('hm').innerHTML=s}
function codesPage(){return `<div class="card"><h2>All referral codes (${D.codes.length})</h2><p class="sub">Every code with calls, all three teams. Most regional calls first. Search, filter, sort, and tap a row.</p><div id="ca"></div></div>`}

/* ---------- yesterday's sheet as an image ---------- */
function dlSheet(T,btn){const r=D.teams[T],rows=D.codes.filter(c=>c[1]==T&&c[5]>0).map(c=>[c[0],c[5],c[4][N-1]]).sort((a,b)=>b[1]-a[1]||b[2]-a[2]||(a[0]>b[0]?1:-1)),tot=rows.reduce((s,x)=>s+x[1],0);
 const PER=40,cols=Math.max(1,Math.ceil(rows.length/PER)),RH=34,CW=300,P=24,HD=96,W=Math.max(cols*CW+P*2,560),H=HD+Math.min(rows.length,PER)*RH+P+34,S=2;
 const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const x=cv.getContext('2d');x.scale(S,S);
 const ff='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.fillStyle=COL[T];x.fillRect(0,0,W,6);x.fillStyle='#16202e';x.font='700 22px '+ff;x.fillText(r.name+' · Calls by code',P,40);
 x.fillStyle='#64708a';x.font='15px '+ff;x.fillText(D.days[N-1]+'  ·  '+rows.length+' codes  ·  total calls '+f(tot),P,66);
 for(let c=0;c<cols;c++){const X=P+c*CW;x.fillStyle='#64708a';x.font='600 11px '+ff;x.textAlign='left';x.fillText('CODE',X+44,HD-8);x.textAlign='right';x.fillText('CALLS',X+CW-26,HD-8)}
 rows.forEach((v,i)=>{const c=Math.floor(i/PER),k=i%PER,X=P+c*CW,Y=HD+k*RH;if(k%2==0){x.fillStyle='#f3f5f9';x.fillRect(X,Y,CW-16,RH)}
  x.fillStyle='#64708a';x.font='13px '+ff;x.textAlign='left';x.fillText(i+1,X+8,Y+22);x.fillStyle='#16202e';x.font='600 15px '+ff;x.fillText(v[0],X+44,Y+22);x.textAlign='right';x.font='700 15px '+ff;x.fillText(f(v[1]),X+CW-26,Y+22);x.textAlign='left'});
 x.fillStyle='#64708a';x.font='12px '+ff;x.fillText('Calls = all eligible calls on the day',P,H-14);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=r.name.replace(/[^A-Za-z0-9]+/g,'-')+'-'+D.dnum[N-1]+'-Nov.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);if(btn){const o=btn.textContent;btn.textContent='✓ Downloaded';setTimeout(()=>btn.textContent=o,1800)}})}
/* ---------- motion helpers ---------- */
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fxBars(root){root.querySelectorAll('.bar i').forEach(i=>{const w=i.dataset.w||(i.dataset.w=i.style.width);if(REDUCE)return;i.style.width='0%';requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=w))})}
function fx(root){
 root.querySelectorAll('.card,.tile,.act,.tcard').forEach((e,i)=>{e.classList.add('rise');e.style.animationDelay=Math.min(i*40,520)+'ms'});
 fxBars(root);
 root.querySelectorAll('circle[data-d]').forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDasharray=c.dataset.d)));
 if(REDUCE)return;
 root.querySelectorAll('.big,.tile b').forEach(e=>{if(e.firstElementChild)return;const m=e.textContent.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/);if(!m)return;
  const v=parseFloat(m[2].replace(/,/g,'')),dec=(m[2].split('.')[1]||'').length,t0=performance.now(),D0=900;
  const step=now=>{const k=Math.min((now-t0)/D0,1),e3=1-Math.pow(1-k,3);e.textContent=m[1]+(v*e3).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
/* ---------- router ---------- */
const TABS=[['ov','Overview','🏠','Home'],['CR','Craftzens','🟦','Craftzens'],['WB','ParisevaOne','🟧','Pariseva'],['OD','mDigital-OD','🟩','OD'],['codes','All codes','🔎','Codes']];
function go(k){location.hash=k;}
function render(keep){let k=location.hash.slice(1);if(!TABS.some(t=>t[0]==k))k='ov';
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==k?'on':''}" onclick="go('${t[0]}')"><span class="ic">${t[2]}</span><span class="lf">${t[1]}</span><span class="ls">${t[3]}</span></button>`).join('');
 const m=document.getElementById('main');m.innerHTML=k=='ov'?overview():k=='codes'?codesPage():team(k);
 if(k=='ov')mount_overview();else if(k=='codes')mount_codes();else mount_team(k);fx(m);if(!keep)scrollTo(0,0);const on=document.querySelector('nav button.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'})}
document.getElementById('hsub').innerHTML=`<span class="pill">Data up to ${D.days[N-1]}</span><span class="pill">⏳ 24 Nov calls in QC</span>`;
let _b=innerWidth<520?1:innerWidth<700?2:3,_t;addEventListener('resize',()=>{clearTimeout(_t);_t=setTimeout(()=>{const b=innerWidth<520?1:innerWidth<700?2:3;if(b!=_b){_b=b;render(1)}},250)});
